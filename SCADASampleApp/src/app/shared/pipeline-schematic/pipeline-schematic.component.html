@if (graph(); as g) {
  <div class="schematic-wrap" [class.compact]="compact()">
    <svg class="schematic" [attr.viewBox]="viewBox()" aria-label="Pipeline schematic">
      <defs>
        <marker [attr.id]="markerId" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" fill="#64748b" />
        </marker>

        @for (edge of edges(); track edge.gradientId) {
          @if (edge.isMultiFluid) {
            <linearGradient
              [attr.id]="edge.gradientId"
              gradientUnits="userSpaceOnUse"
              [attr.x1]="gradientVector(edge.from, edge.to).x1"
              [attr.y1]="gradientVector(edge.from, edge.to).y1"
              [attr.x2]="gradientVector(edge.from, edge.to).x2"
              [attr.y2]="gradientVector(edge.from, edge.to).y2"
            >
              @for (stop of edge.gradientStops; track $index) {
                <stop [attr.offset]="stop.offset + '%'" [attr.stop-color]="stop.color" />
              }
            </linearGradient>
          }
        }
      </defs>

      <!-- Station bounding boxes -->
      @for (bounds of stationBounds(); track bounds.station.stationId) {
        <rect
          class="station-box"
          [attr.x]="bounds.x"
          [attr.y]="bounds.y"
          [attr.width]="bounds.w"
          [attr.height]="bounds.h"
          rx="12"
        />
        <text
          class="station-label"
          [attr.x]="bounds.x + bounds.w / 2"
          [attr.y]="bounds.y - 5"
          text-anchor="middle"
        >{{ bounds.station.name }}</text>
      }

      <!-- Transfer edges (pipe segments) -->
      @for (edge of edges(); track edge.transfer.processTransferId) {
        <line
          [class.edge]="true"
          [class.edge-on]="edge.flowing"
          [class.edge-flow]="edge.flowing"
          [attr.x1]="edge.from.layoutX"
          [attr.y1]="edge.from.layoutY"
          [attr.x2]="edge.to.layoutX"
          [attr.y2]="edge.to.layoutY"
          [attr.stroke]="edge.isMultiFluid ? 'url(#' + edge.gradientId + ')' : dominantFluidColor(edge.transfer.fluids)"
          [attr.marker-end]="'url(#' + markerId + ')'"
        />

        <!-- Valve state icon on midpoint -->
        @if (!edge.transfer.valveOpen) {
          <g [attr.transform]="'translate(' + midPoint(edge.from, edge.to).x + ',' + midPoint(edge.from, edge.to).y + ')'">
            <circle class="valve-closed" r="7" />
            <line x1="-4" y1="-4" x2="4" y2="4" class="valve-cross" />
            <line x1="4" y1="-4" x2="-4" y2="4" class="valve-cross" />
          </g>
        }

        <!-- Flow label(s) -->
        <text
          class="edge-label"
          [attr.x]="midPoint(edge.from, edge.to).x"
          [attr.y]="midPoint(edge.from, edge.to).y - 10"
          text-anchor="middle"
        >
          @for (part of edge.labelParts; track $index) {
            <tspan
              [attr.x]="midPoint(edge.from, edge.to).x"
              [attr.dy]="$index === 0 ? '0' : '11'"
              [attr.fill]="fluidColor(edge.transfer.fluids[$index].fluidCode)"
            >{{ part }} m³/h</tspan>
          }
        </text>
      }

      <!-- Location nodes -->
      @for (loc of g.locations; track loc.processLocationId) {
        <g [attr.transform]="'translate(' + loc.layoutX + ',' + loc.layoutY + ')'">
          <circle class="tank-ring" r="42" />
          @for (f of topFluids(loc); track f.fluidCode; let i = $index) {
            <rect
              class="tank-fluid-seg"
              x="-32"
              [attr.y]="18 + i * 4"
              height="3"
              rx="1"
              [attr.width]="(64 * fillPercent(loc) * (f.volume / (loc.currentVolume || 1))) / 100"
              [attr.fill]="fluidColor(f.fluidCode)"
            />
          }
          <rect class="tank-level-bg" x="-32" y="30" width="64" height="6" rx="2" />
          <rect
            class="tank-level-fill"
            x="-32"
            y="30"
            height="6"
            rx="2"
            [attr.width]="(64 * fillPercent(loc)) / 100"
          />
          <text class="tank-pct" y="-52" text-anchor="middle">{{ fillPercent(loc) | number: '1.0-0' }}%</text>
          <text class="tank-code" y="6" text-anchor="middle">{{ loc.code }}</text>
        </g>
        <text class="tank-meta" [attr.x]="loc.layoutX" [attr.y]="loc.layoutY + 58" text-anchor="middle">
          {{ loc.currentVolume | number: '1.0-1' }} / {{ loc.capacity | number: '1.0-0' }} m³
        </text>
        @for (f of topFluids(loc); track f.fluidCode) {
          <text
            class="tank-fluid"
            [attr.x]="loc.layoutX"
            [attr.y]="loc.layoutY + 72 + $index * 12"
            text-anchor="middle"
            [attr.fill]="fluidColor(f.fluidCode)"
          >
            {{ f.fluidCode }} {{ f.volume | number: '1.0-1' }} m³
          </text>
        }
      }
    </svg>

    @if (!compact() && uniqueFluids().length > 0) {
      <div class="fluid-legend">
        @for (f of uniqueFluids(); track f.code) {
          <span class="legend-dot" [style.background]="f.color"></span>
          <span class="legend-label">{{ f.code }}</span>
        }
      </div>
    }
  </div>
}
